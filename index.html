<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image to SSTV Audio — Martin M1</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}body{margin:0;background:#0b1020;color:#e9eefc;min-height:100vh;display:grid;place-items:center}main{width:min(560px,calc(100% - 32px));background:#171e32;border:1px solid #34405a;border-radius:20px;padding:26px;box-sizing:border-box}h1{font-size:1.55rem;margin:0 0 8px}p{color:#b8c4df;line-height:1.55}label{display:block;margin:18px 0 8px}input{width:100%}canvas{display:block;max-width:100%;width:320px;aspect-ratio:5/4;margin:20px auto;border:1px solid #44516d;background:#0c1220;object-fit:contain}button,a.download{display:inline-block;background:#65a9ff;color:#071426;border:0;border-radius:10px;padding:12px 16px;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;margin:6px 6px 6px 0}button:disabled{opacity:.45;cursor:not-allowed}audio{width:100%;margin:14px 0}progress{width:100%;height:14px}small{color:#aebbd4}.hidden{display:none}
</style></head>
<body><main><h1>Image → Radio Sound</h1><p>Turn a photo into a <strong>Martin M1 SSTV</strong> WAV file. Decode it with the Robot36 Android app.</p>
<label for="file">Choose a JPG or PNG</label><input id="file" type="file" accept="image/*">
<canvas id="preview" width="320" height="256"></canvas>
<button id="generate" disabled>Generate SSTV WAV</button><p id="status" role="status">Choose an image to begin.</p>
<progress id="progress" class="hidden" value="0" max="100"></progress>
<div id="output" class="hidden"><audio id="player" controls></audio><a class="download" id="download" download="sstv-martin-m1.wav">Download WAV</a></div>
<small>Transmission: ~114 seconds · 320 × 256 · 11025 Hz mono WAV. For best results, disable audio enhancements and keep the phone microphone near the speaker.</small></main>
<script src="sstv.js"></script><script>
const file=document.getElementById('file'),canvas=document.getElementById('preview'),ctx=canvas.getContext('2d',{willReadFrequently:true}),button=document.getElementById('generate'),status=document.getElementById('status'),progress=document.getElementById('progress'),output=document.getElementById('output'),player=document.getElementById('player'),download=document.getElementById('download');
let url;
file.addEventListener('change',async()=>{
 button.disabled=true;output.classList.add('hidden');
 const f=file.files[0];if(!f)return;
 try{const image=await createImageBitmap(f);ctx.fillStyle='#000';ctx.fillRect(0,0,320,256);
 const scale=Math.min(320/image.width,256/image.height),w=image.width*scale,h=image.height*scale;
 ctx.drawImage(image,(320-w)/2,(256-h)/2,w,h);image.close();button.disabled=false;status.textContent='Ready to encode.';
 }catch(e){status.textContent='Could not open image: '+e.message;}
});
button.addEventListener('click',async()=>{
 button.disabled=true;output.classList.add('hidden');progress.classList.remove('hidden');progress.value=0;status.textContent='Encoding SSTV...';
 await new Promise(resolve=>setTimeout(resolve,30));
 try{const pcm=SSTV.encode(ctx.getImageData(0,0,320,256),v=>{progress.value=Math.round(v*100)});
 const blob=SSTV.wavBlob(pcm);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);
 player.src=url;download.href=url;output.classList.remove('hidden');status.textContent='Done! Play the WAV and let Robot36 listen. Duration: '+(pcm.length/SSTV.RATE).toFixed(1)+' seconds.';
 }catch(e){status.textContent='Encoding error: '+e.message;}
 finally{button.disabled=false;progress.classList.add('hidden');}
});
</script></body></html>
